name: Self-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Australia/Sydney

jobs:
  selftest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: php -l bin/security-lint.php
      - name: Fixture self-test
        run: bash selftest/run.sh

  scripts-and-templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: ShellCheck
        # Info-level notes (e.g. SC2016 on deliberate single-quoted php -r code) are not failures.
        run: shellcheck --severity=warning bin/*.sh selftest/run.sh
      - name: Install phpcs (moodle-cs) and PHPMD
        run: |
          mkdir -p tools
          echo '{}' > tools/composer.json
          # The standards are registered explicitly below, so moodle-cs's composer installer plugin is not needed.
          composer config --no-plugins --working-dir=tools \
            allow-plugins.dealerdirect/phpcodesniffer-composer-installer false
          composer require --quiet --no-interaction --working-dir=tools moodlehq/moodle-cs:^3.4 phpmd/phpmd:^2.15
          v="$PWD/tools/vendor"
          tools/vendor/bin/phpcs --config-set installed_paths \
            "$v/moodlehq/moodle-cs/Standards,$v/phpcsstandards/phpcsextra,$v/phpcsstandards/phpcsutils"
      - name: Moodle coding style (bin/ and templates/tests/)
        # Plugins copy the templates as-is, so they must pass the same phpcs --max-warnings 0 as plugin CI.
        # .phpcs.xml lists the paths and the CLI-only exclusions for bin/security-lint.php.
        run: tools/vendor/bin/phpcs --standard=.phpcs.xml --warning-severity=1
      - name: PHPMD unused-code ruleset loads and the clean fixture passes it
        run: |
          tools/vendor/bin/phpmd selftest/clean_plugin text config/phpmd-unused.xml \
            --exclude '*/tests/*,*/vendor/*,*/amd/*,*/node_modules/*'
