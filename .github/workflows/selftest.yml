name: Self-test

on: [push, pull_request]

jobs:
  selftest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: php -l bin/security-lint.php
      - name: Fixture self-test
        run: bash selftest/run.sh
